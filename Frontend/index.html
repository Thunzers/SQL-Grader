<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Grader Demo (Frontend-only)</title>
  <!-- Tailwind via CDN (no PostCSS, works anywhere) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 UMD + Babel (for JSX in-browser) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- sql.js (SQLite in WebAssembly) -->
  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-wasm.js"></script>
  <style>
    html, body { height: 100%; }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    // ------------------------ SEED DATA ------------------------
    const SEED_SQL = `
      DROP TABLE IF EXISTS Customers;
      CREATE TABLE Customers (
        CustomerID INTEGER PRIMARY KEY,
        CustomerName TEXT NOT NULL,
        ContactName TEXT,
        Address TEXT,
        City TEXT,
        PostalCode TEXT,
        Country TEXT
      );
      INSERT INTO Customers (CustomerName, ContactName, Address, City, PostalCode, Country) VALUES
      ('Alfreds Futterkiste','Maria Anders','Obere Str. 57','Berlin','12209','Germany'),
      ('Ana Trujillo Emparedados y helados','Ana Trujillo','Avda. de la Constitución 2222','México D.F.','05021','Mexico'),
      ('Antonio Moreno Taquería','Antonio Moreno','Mataderos 2312','México D.F.','05023','Mexico'),
      ('Around the Horn','Thomas Hardy','120 Hanover Sq.','London','WA1 1DP','UK'),
      ('Berglunds snabbköp','Christina Berglund','Berguvsvägen 8','Luleå','S-958 22','Sweden'),
      ('Blauer See Delikatessen','Hanna Moos','Forsterstr. 57','Mannheim','68306','Germany'),
      ('Bon app','Laurence Lebihan','12, rue des Bouchers','Marseille','13008','France'),
      ('Du monde entier','Janine Labrune','67, rue des Cinquante Otages','Nantes','44000','France'),
      ('France restauration','Carine Schmitt','54, rue Royale','Nantes','44000','France'),
      ("La maison d'Asie","Annette Roulet","1 rue Alsace-Lorraine","Toulouse","31000","France"),
      ('LILA-Supermercado','Carlos González','Carrera 52 con Ave. Bolívar #65-98 Llano Largo','Barquisimeto','3508','Venezuela');
    `;

    // ------------------------ PROBLEM ------------------------
    const PROBLEM = {
      title: 'List French customers (name + city)',
      difficulty: 'easy',
      tags: ['SQL','SELECT','WHERE','ORDER BY'],
      detail: 'จงเขียนคำสั่ง SQL เพื่อแสดง CustomerName และ City ของลูกค้าที่อยู่ในประเทศ France เท่านั้น โดยเรียงชื่อจาก A→Z.',
      testCase: 'ผลลัพธ์ต้องมี 4 แถวและคอลัมน์ CustomerName, City เรียงตามชื่อ.',
      expectedSQL: `SELECT CustomerName, City FROM Customers WHERE Country = 'France' ORDER BY CustomerName;`
    };

    // ------------------------ HELPERS ------------------------
    function normalize(table){
      if(!table) return {columns:[], rows:[]};
      const columns = table.columns.map(c => String(c).toLowerCase());
      const rows = table.values.map(r => r.map(v => v===null? null : v));
      const key = r => JSON.stringify(r);
      const sorted = [...rows].sort((a,b)=> key(a)<key(b)?-1:key(a)>key(b)?1:0);
      return { columns, rows: sorted };
    }
    function sameResult(a,b){
      if(!a||!b) return false;
      if(a.columns.length !== b.columns.length) return false;
      if(JSON.stringify(a.columns) !== JSON.stringify(b.columns)) return false;
      if(a.rows.length !== b.rows.length) return false;
      for(let i=0;i<a.rows.length;i++){
        if(JSON.stringify(a.rows[i]) !== JSON.stringify(b.rows[i])) return false;
      }
      return true;
    }

    function App(){
      const [db, setDb] = useState(null);
      const [sql, setSql] = useState(PROBLEM.starterSQL);
      const [result, setResult] = useState(null);
      const [logs, setLogs] = useState([]);
      const [gradeInfo, setGradeInfo] = useState(null);

      // init sql.js and seed DB
      useEffect(()=>{
        (async ()=>{
          const SQL = await initSqlJs({
            locateFile: (f) => `https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/${f}`
          });
          const _db = new SQL.Database();
          _db.run(SEED_SQL);
          setDb(_db);
          setLogs(l=>[...l, 'DB ready (seed loaded).']);
        })();
      },[]);

      const run = () => {
        if(!db) return;
        setGradeInfo(null);
        try{
          const out = db.exec(sql);
          if(out && out.length){
            const t = out[out.length-1];
            setResult({ columns: t.columns, rows: t.values });
            setLogs(l=>[...l, `OK: executed (${out.length}) statement(s).`]);
          } else {
            setResult({ columns: [], rows: [] });
            setLogs(l=>[...l, 'OK: no result set.']);
          }
        }catch(e){
          setLogs(l=>[...l, `ERROR: ${e.message}`]);
        }
      };

      const resetDb = () => {
        if(!db) return;
        db.run('VACUUM;');
        db.run(SEED_SQL);
        setLogs(l=>[...l, 'Database reset.']);
        setResult(null);
        setGradeInfo(null);
      };

      const showSchema = () => {
        if(!db) return;
        try{
          const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;");
          const lines = [];
          tables.forEach(t=>{
            t.values.forEach(v=>{
              const name = v[0];
              const pragma = db.exec(`PRAGMA table_info(${name});`)[0];
              const cols = pragma.values.map(r=>`${r[1]} ${r[2]}${r[3] ? ' NOT NULL' : ''}`).join(', ');
              lines.push(`• ${name}(${cols})`);
            });
          });
          setLogs(l=>[...l, 'Schema:\n'+lines.join('\n')]);
        }catch(e){
          setLogs(l=>[...l, `ERROR: ${e.message}`]);
        }
      };

      const grade = () => {
        if(!db) return;
        try{
          const userRaw = db.exec(sql);
          const expRaw = db.exec(PROBLEM.expectedSQL);
          const userTable = userRaw[userRaw.length-1];
          const expTable = expRaw[expRaw.length-1];
          const A = normalize(userTable);
          const B = normalize(expTable);
          const pass = sameResult(A,B);
          setGradeInfo(pass ? { pass:true, msg:'✅ Correct' } : { pass:false, msg:'❌ Not matched' });
          if(!pass) setResult({ columns: userTable?.columns||[], rows: userTable?.values||[] });
          setLogs(l=>[...l, pass? 'GRADE: PASS' : 'GRADE: FAIL']);
        }catch(e){
          setLogs(l=>[...l, `ERROR grading: ${e.message}`]);
        }
      };

      const ResultTable = useMemo(()=>{
        if(!result || !result.columns?.length) return null;
        return (
          <div className="mt-3 border border-zinc-700 rounded-xl overflow-auto">
            <table className="w-full text-sm">
              <thead className="bg-zinc-800 sticky top-0 text-white">
                <tr>
                  {result.columns.map((c,i)=> (
                    <th key={i} className="text-left px-3 py-2 font-semibold">{c}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {result.rows.map((r,ri)=> (
                  <tr key={ri} className="odd:bg-zinc-900/40 text-zinc-100">
                    {r.map((v,ci)=> (
                      <td key={ci} className="px-3 py-2 whitespace-nowrap">{String(v)}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      },[result]);

      return (
        <div className="min-h-screen w-full">
          {/* Header */}
          <div className="bg-white/80 backdrop-blur sticky top-0 z-10 border-b">
            <div className="max-w-[1200px] mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-zinc-200" />
                <span className="font-semibold">SQL Grader Demo (Frontend-only)</span>
              </div>
            </div>
          </div>

          {/* Main Grid */}
          <div className="max-w-[1200px] mx-auto px-4 py-6 grid grid-cols-12 gap-6">
            {/* Left: Problem Detail */}
            <div className="col-span-12 lg:col-span-4">
              <div className="bg-white rounded-2xl shadow-sm border p-4">
                <div className="text-xs text-zinc-500">Problem</div>
                <div className="font-semibold text-lg">{PROBLEM.title}</div>
                <div className="text-xs text-emerald-600">difficulty : {PROBLEM.difficulty}</div>

                <div className="mt-3 text-xs text-zinc-500 flex items-center gap-2 flex-wrap">
                  <span>tag :</span>
                  {PROBLEM.tags.map(t => (
                    <span key={t} className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full border">{t}</span>
                  ))}
                </div>

                <div className="mt-4">
                  <div className="font-semibold">Problem detail</div>
                  <p className="text-sm text-zinc-700 mt-1 leading-relaxed">{PROBLEM.detail}</p>
                </div>

                <div className="mt-4">
                  <div className="font-semibold">Test case</div>
                  <p className="text-sm text-zinc-700 mt-1 leading-relaxed">{PROBLEM.testCase}</p>
                </div>
              </div>
            </div>

            {/* Right: SQL Pad */}
            <div className="col-span-12 lg:col-span-8">
              <div className="bg-[#2b2f3a] text-zinc-100 rounded-2xl overflow-hidden shadow-lg">
                <div className="px-4 py-2 text-xs bg-[#252935] border-b border-[#1f2330]">SQL Pad</div>
                <div className="p-4">
                  <textarea
                    value={sql}
                    onChange={e=>setSql(e.target.value)}
                    className="w-full h-56 font-mono text-sm bg-[#1f2330] text-zinc-100 rounded-xl p-3 outline-none border border-[#394057] focus:border-indigo-400"
                    placeholder="Type SQL here..."
                    spellCheck={false}
                  />

                  <div className="mt-3 flex flex-wrap gap-2">
                    <button onClick={run} className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white">Run</button>
                    <button onClick={grade} className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white">Grade</button>
                    <button onClick={resetDb} className="px-3 py-1.5 rounded-xl bg-zinc-600 hover:bg-zinc-700 text-white">Reset DB</button>
                    <button onClick={showSchema} className="px-3 py-1.5 rounded-xl bg-zinc-700 hover:bg-zinc-800 text-white">Show Schema</button>
                  </div>

                  {gradeInfo && (
                    <div className={`mt-3 text-sm px-3 py-2 rounded-lg ${gradeInfo.pass ? 'bg-emerald-600/20 text-emerald-200' : 'bg-rose-600/20 text-rose-200'}`}>
                      {gradeInfo.msg}
                    </div>
                  )}

                  {ResultTable}

                  <div className="mt-4 text-xs bg-[#1f2330] border border-[#394057] rounded-xl p-3 h-36 overflow-auto whitespace-pre-wrap">
                    {logs.map((l,i)=> (<div key={i}>$ {l}</div>))}
                  </div>

                  <div className="mt-3 text-right">
                    <button onClick={run} className="px-4 py-2 bg-zinc-800 rounded-lg hover:bg-zinc-700">Submit</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Footer */}
          <div className="py-8 text-center text-xs text-zinc-500">Runs fully in-browser via sql.js (WASM). No backend required.</div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
